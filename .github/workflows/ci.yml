name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_package_maker
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_package_maker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - name: Restore pinned reactive-lms checkout
        uses: actions/cache@v4
        with:
          path: .cache/reactive-lms
          key: reactive-lms-${{ hashFiles('packages/conformance/reactive-lms.json') }}
      - name: Fetch pinned reactive-lms (conformance tests)
        run: bun run conformance:fetch
      - name: Install Chromium (conformance tests)
        run: bun run conformance:browser
      - name: Apply database migrations
        run: bun run --cwd apps/web prisma:deploy
      - run: bun run typecheck
      - name: Build the web app (browser tests run against it)
        run: bun run build:web
      - run: bun run test
