name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - name: Restore pinned reactive-lms checkout
        uses: actions/cache@v4
        with:
          path: .cache/reactive-lms
          key: reactive-lms-${{ hashFiles('packages/conformance/reactive-lms.json') }}
      - name: Fetch pinned reactive-lms (conformance tests)
        run: bun run conformance:fetch
      - name: Install Chromium (conformance tests)
        run: bunx playwright-core install --with-deps chromium
      - run: bun run typecheck
      - run: bun run test
